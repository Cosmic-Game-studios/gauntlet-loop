<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena</title><link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1512;font-family:system-ui,Segoe UI,sans-serif;color:#f2e6d8}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(20,14,10,.72);z-index:10}
.ov.show{display:flex}
.ov h1{font-size:64px;letter-spacing:.3em;margin:0 0 8px;color:#ffb36b;text-shadow:0 0 20px #ff7a2a88}
.ov p{opacity:.8;margin:4px 0 20px}
.btn{pointer-events:auto;min-width:220px;margin:6px;padding:12px 20px;font-size:18px;letter-spacing:.15em;background:#2b2320;color:#f2e6d8;border:1px solid #4fd6d0;cursor:pointer;text-transform:uppercase}
.btn:hover{background:#4fd6d0;color:#15100d}
.row{display:flex;gap:12px;align-items:center;margin:8px}.row label{width:170px}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#hud.show{display:block}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#hitm{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
#hitm:before,#hitm:after{content:"";position:absolute;background:#ff5a3a}
#hitm:before{left:16px;top:0;width:2px;height:34px}#hitm:after{top:16px;left:0;height:2px;width:34px}
#hpwrap{position:absolute;left:24px;bottom:24px;width:260px}
#hpbar{height:14px;background:#3a2c26;border:1px solid #6b5a50}#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff7a2a,#ffc36b)}
#hptxt{font-size:28px;font-weight:700}
#ammo{position:absolute;right:24px;bottom:24px;text-align:right}
#ammo .big{font-size:40px;font-weight:700}#ammo .wn{color:#4fd6d0;letter-spacing:.2em;text-transform:uppercase}
#top{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:.15em}
#banner{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:44px;letter-spacing:.3em;color:#ffb36b;text-shadow:0 0 16px #000;opacity:0;transition:opacity .3s}
#dmg{position:absolute;left:50%;top:50%;width:0;height:0}
.arc{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border-top:6px solid rgba(255,40,20,.9);opacity:0}
#vign{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(255,0,0,.7);opacity:0}
#reloadtxt{position:absolute;left:50%;top:58%;transform:translateX(-50%);color:#ffc36b;letter-spacing:.2em;display:none}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<div id="hud"><div id="vign"></div><div id="cross"></div><div id="hitm"></div>
<div id="dmg"><div class="arc"></div><div class="arc"></div><div class="arc"></div><div class="arc"></div></div>
<div id="top">WAVE <b id="wave">1</b> / 5 &nbsp;|&nbsp; SCORE <b id="score">0</b> &nbsp;|&nbsp; ENEMIES <b id="alive">0</b></div>
<div id="banner"></div><div id="reloadtxt">RELOADING</div>
<div id="hpwrap"><div id="hptxt">100</div><div id="hpbar"><div id="hpfill"></div></div></div>
<div id="ammo"><div class="wn" id="wname">rifle</div><div class="big"><span id="mag">30</span> / <span id="res">90</span></div></div>
</div>
<div class="ov show" id="menu"><h1>ARENA</h1><p>Hold the pit. Five waves.</p>
<button class="btn" data-act="play">Play</button><button class="btn" data-act="settings">Settings</button></div>
<div class="ov" id="pause"><h1>PAUSED</h1><button class="btn" data-act="resume">Resume</button><button class="btn" data-act="settings">Settings</button><button class="btn" data-act="quit">Main Menu</button></div>
<div class="ov" id="settings"><h1>SETTINGS</h1>
<div class="row"><label>Mouse sensitivity</label><input type="range" id="sens" min="0.2" max="3" step="0.05" value="1"><span id="sensv">1.00</span></div>
<div class="row"><label>Master volume</label><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"><span id="volv">70</span></div>
<button class="btn" data-act="back">Back</button></div>
<div class="ov" id="gameover"><h1>DOWN</h1><p id="goscore"></p><button class="btn" data-act="restart">Restart</button><button class="btn" data-act="quit">Main Menu</button></div>
<div class="ov" id="victory"><h1>VICTORY</h1><p id="vscore"></p><button class="btn" data-act="restart">Restart</button><button class="btn" data-act="quit">Main Menu</button></div>
<script type="module" src="./src/main.js"></script>
</body></html>
